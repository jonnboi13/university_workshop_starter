version: 2

models:
  - name: mart_customer_segments
    description: "Customer behavior summary grouped into one-time, returning, and loyal customer segments."
    columns:
      - name: customer_segment
        description: "Customer segment based on order count: One-time, Returning, or Loyal."
        tests:
          - not_null
          - unique

      - name: customer_count
        description: "Number of customers in the segment."

      - name: total_orders
        description: "Total orders placed by customers in the segment."

      - name: average_orders_per_customer
        description: "Average number of orders per customer in the segment."

      - name: average_order_value
        description: "Average order total for all orders in the segment, weighted equally by order."

      - name: average_gross_margin_per_order
        description: "Average gross margin for all orders in the segment."

      - name: average_gross_margin_per_customer
        description: "Average gross margin generated per customer in the segment."

      - name: gross_margin_percent
        description: "Segment gross margin as a percentage of revenue on a 0 to 100 scale."

      - name: total_revenue
        description: "Total item-level revenue generated by the segment."

      - name: total_gross_margin
        description: "Total gross margin generated by the segment."

  - name: mart_customer_behavior
    description: "Customer-level order history and purchasing behavior with one row per customer."
    columns:
      - name: customer_id
        description: "Unique customer identifier and primary key of this mart."
        tests:
          - not_null
          - unique

      - name: customer_name
        description: "Customer name."

      - name: order_count
        description: "Total number of orders placed by the customer."

      - name: first_order_date
        description: "Date of the customer's first order in the available data."

      - name: last_order_date
        description: "Date of the customer's most recent order in the available data."

      - name: total_revenue
        description: "Total item-level revenue generated by the customer."

      - name: average_revenue_per_order
        description: "Average item-level revenue per order."

      - name: total_order_value
        description: "Sum of the order totals, including tax."

      - name: average_order_value
        description: "Average order total, including tax."

      - name: total_gross_margin
        description: "Total gross margin generated by the customer's orders."

      - name: gross_margin_percent
        description: "Customer gross margin as a percentage of revenue on a 0 to 100 scale."

      - name: average_days_between_orders
        description: "Average number of days between the customer's orders."

      - name: repeat_order_count
        description: "Number of orders after the customer's first order."

      - name: is_repeat_customer
        description: "Whether the customer placed more than one order."

  - name: mart_product_performance
    description: "Product-level sales and profitability summary with one row per product SKU."
    columns:
      - name: sku
        description: "Unique product SKU and primary key of this mart."
        tests:
          - not_null
          - unique

      - name: product_name
        description: "Product name used to compare product performance."

      - name: product_type
        description: "Product category, such as jaffle or beverage."

      - name: product_price
        description: "Listed selling price of the product."

      - name: units_sold
        description: "Number of item records sold for the product."

      - name: unique_customers
        description: "Number of distinct customers who purchased the product."

      - name: revenue
        description: "Total revenue generated by the product."

      - name: cost
        description: "Total supply cost associated with the product sales."

      - name: gross_margin
        description: "Total revenue minus total supply cost for the product."

      - name: gross_margin_percent
        description: "Product gross margin as a percentage of revenue on a 0 to 100 scale."

      - name: average_revenue_per_sale
        description: "Average revenue generated by each sale of the product."

  - name: mart_margin_by_time
    description: "Profitability summary by weekend status and time of day. Each row represents one weekend-status and time-of-day combination."
    columns:
      - name: is_weekend
        description: "Whether the orders occurred on Saturday or Sunday."
        tests:
          - not_null

      - name: time_of_day
        description: "Broad time bucket: Morning, Afternoon, or Evening."
        tests:
          - not_null

      - name: active_days
        description: "Number of distinct order dates represented in the group."

      - name: order_count
        description: "Number of orders in the weekend-status and time-of-day group."

      - name: orders_per_day
        description: "Average number of orders per active date in the group."

      - name: revenue
        description: "Total selling revenue in the weekend-status and time-of-day group."

      - name: revenue_per_day
        description: "Average revenue per active date in the group."

      - name: cost
        description: "Total supply cost in the weekend-status and time-of-day group."

      - name: cost_per_day
        description: "Average supply cost per active date in the group."

      - name: gross_margin
        description: "Total gross margin in the weekend-status and time-of-day group."

      - name: gross_margin_per_day
        description: "Average gross margin per active date in the group."

      - name: gross_margin_percent
        description: "Gross margin as a percentage of revenue on a 0 to 100 scale."

      - name: average_order_margin
        description: "Average gross margin per order in the day and hour group."

  - name: dim_date
    description: "Calendar dimension with one row per date represented in the order history."
    columns:
      - name: date_day
        description: "Calendar date and primary key for the date dimension."
        tests:
          - not_null
          - unique

      - name: date_key
        description: "Integer date key formatted as YYYYMMDD."
        tests:
          - not_null
          - unique

      - name: day_name
        description: "Full name of the day, such as Monday."

      - name: day_of_week
        description: "Day-of-week number returned by BigQuery, where Sunday is 1 and Saturday is 7."

      - name: week_of_year
        description: "ISO week number for the date."

      - name: week_start_date
        description: "Monday that begins the date's week."

      - name: month_number
        description: "Numeric month from 1 through 12."

      - name: month_name
        description: "Full name of the month, such as January."

      - name: quarter_number
        description: "Quarter of the year from 1 through 4."

      - name: year
        description: "Four-digit calendar year."

      - name: is_weekend
        description: "Whether the date falls on Saturday or Sunday."

  - name: dim_customer
    description: "Customer dimension with one row per customer."
    columns:
      - name: customer_id
        description: "Unique identifier for the customer."
        tests:
          - not_null
          - unique

      - name: customer_name
        description: "Customer name."

  - name: dim_product
    description: "Product dimension with one row per product."
    columns:
      - name: sku
        description: "Unique identifier for the product."
        tests:
          - not_null
          - unique

      - name: product_name
        description: "Product name."

      - name: product_type
        description: "Product type."

      - name: product_price
        description: "Product price in dollars."

      - name: product_description
        description: "Description of the product."

  - name: dim_store
    description: "Store dimension with one row per store."
    columns:
      - name: store_id
        description: "Unique identifier for the store."
        tests:
          - not_null
          - unique

      - name: store_name
        description: "Store name."

      - name: opened_date
        description: "Date when the store opened."

      - name: tax_rate
        description: "Tax rate applied by the store."

  - name: fact_orders
    description: "Fact table with one row per order."
    columns:
      - name: order_id
        description: "Unique identifier for the order."
        tests:
          - not_null
          - unique

      - name: customer_id
        description: "Identifier of the customer who placed the order."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id

      - name: store_id
        description: "Identifier of the store associated with the order."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_id

      - name: ordered_at
        description: "Timestamp when the order was placed."

      - name: ordered_date
        description: "Calendar date when the order was placed."

      - name: item_count
        description: "Number of items in the order."

      - name: revenue
        description: "Total selling revenue from the items in the order."

      - name: cost
        description: "Total supply cost for the items in the order."

      - name: gross_margin
        description: "Order revenue minus total supply cost."

      - name: gross_margin_percent
        description: "Gross margin as a percentage of order revenue, returned on a 0 to 100 scale."

      - name: order_subtotal
        description: "Order subtotal before tax."

      - name: order_tax_paid
        description: "Tax charged on the order."

      - name: order_total
        description: "Total order amount after tax."
